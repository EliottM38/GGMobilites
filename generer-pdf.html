<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Génération fiche horaire — GGMobilités</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#F7F8FC;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1rem;color:#0F1923}
    .box{background:white;border-radius:12px;padding:2rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.08);max-width:400px;width:90%}
    .spinner{width:40px;height:40px;border:3px solid #E0E6F0;border-top-color:#185FA5;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    .msg{font-size:15px;color:#5A6272}
    .title{font-size:18px;font-weight:700;margin-bottom:0.5rem;color:#0F1923}
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <div class="title" id="title">Génération en cours...</div>
    <div class="msg" id="msg">Préparation de la fiche horaire</div>
  </div>
<script>
const p = new URLSearchParams(location.search);
const CODE = p.get('code');
const SENS = p.get('sens') === 'retour' ? 'retour' : 'aller';

function hexRgb(h){ h=(h||'#185FA5').replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
const JOUR_LABEL = {semaine:'Lundi – Vendredi', samedi:'Samedi', dimanche:'Dimanche'};

async function generer(){
  try{
    if(!CODE) throw new Error('Aucune ligne spécifiée.');
    document.getElementById('msg').textContent = 'Chargement des données...';

    const cfg = await fetch('/api/config').then(r=>r.json());
    const supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

    const { data: ligne, error: e1 } = await supabaseClient.from('lignes').select('*').eq('code', CODE).single();
    if(e1 || !ligne) throw new Error('Ligne introuvable : ' + CODE);

    const { data: las } = await supabaseClient.from('ligne_arrets').select('ordre, arrets(nom, lieu_nom)').eq('ligne_code', CODE).eq('sens', SENS).order('ordre');
    const arrets = (las||[]).map(x=>x.arrets).filter(Boolean);

    const { data: freqs } = await supabaseClient.from('frequences').select('*').eq('ligne_code', CODE).eq('sens', SENS);

    document.getElementById('msg').textContent = 'Génération du PDF...';
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    const W=297, H=210;
    const color = hexRgb(ligne.couleur);
    const depart = SENS==='aller' ? ligne.terminus_a : ligne.terminus_b;
    const arrivee = SENS==='aller' ? ligne.terminus_b : ligne.terminus_a;

    // ── En-tête ──────────────────────────────────────────
    doc.setFillColor(...color); doc.rect(0,0,W,32,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(8); doc.setFont('helvetica','bold');
    doc.text('GGMobilités', 12, 9);
    doc.setFillColor(255,255,255); doc.roundedRect(8,13,22,14,2,2,'F');
    doc.setTextColor(...color); doc.setFontSize(15); doc.text(String(CODE), 19, 22, {align:'center'});
    doc.setTextColor(255,255,255); doc.setFontSize(15); doc.setFont('helvetica','bold');
    doc.text(depart + '  →  ' + arrivee, 36, 20);
    doc.setFontSize(9); doc.setFont('helvetica','normal');
    doc.text('Fiche horaire · Édité le ' + new Date().toLocaleDateString('fr-FR'), W-12, 27, {align:'right'});

    // ── Arrêts desservis (liste ordonnée) ───────────────
    let y = 42;
    doc.setTextColor(...color); doc.setFontSize(11); doc.setFont('helvetica','bold');
    doc.text('Arrêts desservis', 12, y);
    y += 6;
    doc.setFontSize(8); doc.setTextColor(30,30,30); doc.setFont('helvetica','normal');
    const colW = 62, rowH = 5.2, maxRows = Math.floor((150-y)/rowH);
    arrets.forEach((a, i) => {
      const col = Math.floor(i / maxRows);
      const row = i % maxRows;
      const x = 12 + col*colW;
      const yy = y + row*rowH;
      if(x > W-12) return;
      const isTerm = i===0 || i===arrets.length-1;
      doc.setFont('helvetica', isTerm ? 'bold' : 'normal');
      const label = (i+1) + '. ' + a.nom + (a.lieu_nom ? '  📍' : '');
      doc.text(label.substring(0,42), x, yy);
    });

    // ── Tableau des fréquences ───────────────────────────
    let fy = 155;
    doc.setDrawColor(...color); doc.setLineWidth(0.4); doc.line(12, fy-6, W-12, fy-6);
    doc.setTextColor(...color); doc.setFontSize(11); doc.setFont('helvetica','bold');
    doc.text('Fréquences de passage', 12, fy);
    fy += 8;

    ['semaine','samedi','dimanche'].forEach(jour => {
      const rows = (freqs||[]).filter(f=>f.jour===jour).sort((a,b)=>a.heure_debut.localeCompare(b.heure_debut));
      doc.setFillColor(245,245,248); doc.rect(12, fy-4, W-24, 6, 'F');
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...color);
      doc.text(JOUR_LABEL[jour], 14, fy);
      doc.setFont('helvetica','normal'); doc.setTextColor(60,60,60);
      if(!rows.length){
        doc.text('Pas de service.', 70, fy);
      } else {
        const txt = rows.map(r => r.heure_debut.slice(0,5)+'–'+r.heure_fin.slice(0,5)+' : toutes les '+r.intervalle_minutes+' min').join('     ');
        doc.text(txt, 70, fy);
      }
      fy += 7;
    });

    doc.setFontSize(7); doc.setTextColor(150,150,150);
    doc.text('Fréquences indicatives, susceptibles de varier selon le trafic. GGMobilités · Réseau de Grenoble.', 12, H-8);

    doc.save('GGMobilites_' + CODE + '_' + SENS + '.pdf');
    document.getElementById('spinner').style.display='none';
    document.getElementById('title').textContent='✅ Fiche téléchargée !';
    document.getElementById('msg').textContent = 'Ligne ' + CODE + ' · ' + depart + ' → ' + arrivee;
    setTimeout(()=>window.close(), 2000);
  }catch(e){
    document.getElementById('spinner').style.display='none';
    document.getElementById('title').textContent='❌ Erreur';
    document.getElementById('msg').textContent = e.message;
    console.error(e);
  }
}
generer();
</script>
</body>
</html>
